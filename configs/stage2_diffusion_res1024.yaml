flux_path: "black-forest-labs/FLUX.1-dev"
dtype: "bfloat16"

# =============================================================================
# Stage 2 — 1024x1024 Resolution Training
#
# IMPORTANT: Set RES1024=True in univl/pipeline/flux_univl.py before running!
#
# Memory: ~80GB per GPU at batch_size=1 with two-condition.
# Use accumulate_grad_batches=6 to simulate batch_size=12 (2 GPU × 1 × 6).
# For single-condition (TWO_CONDITION=False): batch_size=2 may fit.
# =============================================================================

model:
  independent_condition: false
  train_ocr_projector: false
  deepseek_w_path: "checkpoints/deepseek_ocr_vision.safetensors"  # see tools/extract_deepseek_ocr_vision_weights.py
  training_phase: 2

  trained_adapter_path: "runs/<stage1-run>/ckpt/final/omini_adapter.safetensors"  # Stage-1 output (required)
  # Optional warm start from an existing Stage-2 checkpoint. Our run of this ablation
  # was initialized from a 512x512 Stage-2 checkpoint.
  trained_lora_path: null  # e.g. "runs/<stage2-run>/ckpt/<step>/default.safetensors"

  # Alignment losses
  l2_loss_lambda: 4.0
  clip_align_lambda: 3.5
  clip_text_lambda: 3.0

train:
  # batch_size=1 for two-condition, 2 for single-condition (A100 80GB)
  batch_size: 4
  # Simulate larger batch via gradient accumulation
  accumulate_grad_batches: 1
  dataloader_workers: 4
  save_interval: 1000
  sample_interval: 100
  max_steps: -1
  gradient_checkpointing: true
  save_path: "runs"

  condition_type: "ocr"
  dataset:
    condition_size:
      - 1024
      - 1024
    target_size:
      - 1024
      - 1024
    drop_text_prob: 0.1
    drop_image_prob: 0.1
    multibox_ratio: 0.20

  wandb:
    project: "UniVL"

  lora_config:
    r: 8
    lora_alpha: 8
    init_lora_weights: "gaussian"
    target_modules: "(.*x_embedder|.*(?<!single_)transformer_blocks\\.[0-9]+\\.norm1\\.linear|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_k|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_q|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_v|.*(?<!single_)transformer_blocks\\.[0-9]+\\.attn\\.to_out\\.0|.*(?<!single_)transformer_blocks\\.[0-9]+\\.ff\\.net\\.2|.*single_transformer_blocks\\.[0-9]+\\.norm\\.linear|.*single_transformer_blocks\\.[0-9]+\\.proj_mlp|.*single_transformer_blocks\\.[0-9]+\\.proj_out|.*single_transformer_blocks\\.[0-9]+\\.attn.to_k|.*single_transformer_blocks\\.[0-9]+\\.attn.to_q|.*single_transformer_blocks\\.[0-9]+\\.attn.to_v|.*single_transformer_blocks\\.[0-9]+\\.attn.to_out)"

  optimizer:
    type: AdamW
    params:
      lr: 0.00005       # slightly lower LR for fine-tuning from 512
      weight_decay: 0.001
